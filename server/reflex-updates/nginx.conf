# Included inside the existing test.doitbenai.cloud HTTPS server only.
location = /reflex/updates/stable.json {
    alias /var/www/reflex-updates/stable.json;
    default_type application/json;
    add_header Cache-Control "no-cache, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    disable_symlinks on;
    limit_except GET { deny all; }
}
location ^~ /reflex/updates/releases/ {
    alias /var/www/reflex-updates/releases/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    disable_symlinks on;
    limit_except GET { deny all; }
}
location ^~ /reflex/updates/ { return 404; }
